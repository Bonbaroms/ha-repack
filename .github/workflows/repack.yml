name: Repack Home Assistant (gzip)

on:
  schedule:
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, Extract, and Rebuild Gzip Image
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="ghcr.io/${REPO_OWNER}/home-assistant:stable"

          # 1. Pull the official upstream image
          docker pull --platform linux/amd64 ghcr.io/home-assistant/home-assistant:stable

          # 2. Create a dummy container to access the unpacked rootfs
          CONTAINER_ID=$(docker create ghcr.io/home-assistant/home-assistant:stable)

          # 3. Export the raw filesystem and import it back into Docker
          # docker import creates standard Docker v2 schema gzip layers by default
          docker export "${CONTAINER_ID}" | docker import \
            --change 'ENTRYPOINT ["/init"]' \
            --change 'ENV S6_SERVICES_GRACETIME=22000' \
            - "${TARGET_IMAGE}"

          # 4. Clean up dummy container
          docker rm -v "${CONTAINER_ID}"

          # 5. Push the guaranteed gzip image to GHCR
          docker push "${TARGET_IMAGE}"
