name: Repack Home Assistant (gzip)

on:
  schedule:
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Force Recompress to Gzip and Push
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TARGET_IMAGE="ghcr.io/${REPO_OWNER}/home-assistant:stable"

          # Create a minimal Dockerfile referencing upstream
          echo "FROM ghcr.io/home-assistant/home-assistant:stable" > Dockerfile

          # Build and force full re-compression of all layers into standard gzip
          docker buildx build \
            --platform linux/amd64 \
            --output "type=image,name=${TARGET_IMAGE},push=true,compression=gzip,force-compression=true,oci-mediatypes=false" \
            .
