name: Repack Home Assistant (gzip)

on:
  schedule:
    - cron: '0 4 * * 4'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  repack:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, Recompress to Gzip, and Push
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Pull official image
          docker pull --platform linux/amd64 ghcr.io/home-assistant/home-assistant:stable

          # Retag for personal registry
          docker tag ghcr.io/home-assistant/home-assistant:stable ghcr.io/${REPO_OWNER}/home-assistant:stable

          # Push using standard gzip compression format
          docker push ghcr.io/${REPO_OWNER}/home-assistant:stable
